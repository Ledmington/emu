plugins {
	id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

// utility function
static def path(final String ...s) {
	return String.join(File.separator, s)
}

String emuGUIVersion = "0.1.0"
String fatJarBaseName = "${rootProject.appNameLowerCase}-gui-${emuGUIVersion}"
String fatJarName = "${fatJarBaseName}.jar"
String fatJarPath = path("${project.layout.buildDirectory.get().toString()}", "libs", "${fatJarName}")
String mainClassName = "${rootProject.basePackage}.view.Launcher"

dependencies {
    implementation project(':core')
    implementation project(':elf')
    implementation project(':id')
    implementation project(':mem')
    implementation project(':utils')
}

application {
	mainClass = mainClassName
}

run {
	args = []
	jvmArgs = []
	// org.openjfx.javafxplugin (0.1.0) wires JavaFX module args into this task in a way that
	// touches Task.extensions/SourceSetContainer at execution time, which the configuration
	// cache disallows. This is a known upstream limitation of the plugin that has not seen
	// activity since 2025; if it remains unaddressed we may need to fork the plugin or drop
	// the gui module entirely.
	notCompatibleWithConfigurationCache("org.openjfx.javafxplugin is incompatible with the configuration cache")
}

javafx {
	version = '21.0.7'
	modules = [ 'javafx.controls', 'javafx.graphics' ]
}

tasks.register('fatJar', Jar) {
	group = 'distribution'
	description = 'Builds the fat jar of the application'
	from sourceSets.main.output
	dependsOn configurations.runtimeClasspath
	from {
		configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
	}
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	manifest {
		archiveBaseName = rootProject.appNameLowerCase
		attributes(
				"Implementation-Title": "EMU GUI",
				"Implementation-Version": "${emuGUIVersion}",
				"Main-Class": "$mainClassName"
		)
	}
	archiveBaseName = "${fatJarBaseName}"

	doLast {
		printf "The fat jar is %s\n", fatJarPath
		printf "Fat jar size: %.3f MB\n", new File(fatJarPath).length() / 1_000_000L
	}
}

tasks.build.dependsOn(fatJar)
tasks.javadoc.enabled = false
